[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demographic-inference"
version = "0.1.0"
description = "Hybrid LLM + Dempster-Shafer Theory pipeline for inferring demographics (age, gender, location) from X (Twitter) user data."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "MANUE"},
]
keywords = ["dempster-shafer", "llm", "demographics", "inference", "twitter", "gemini"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "google-generativeai>=0.8.0",
    "pandas>=2.0.0",
    "Pillow>=10.0.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
querychat = [
    "querychat[viz] @ git+https://github.com/posit-dev/querychat.git@py/v0.6.0",
    "chatlas[google]",
    "duckdb",
    "shiny",
]

[project.scripts]
demoinfer = "demographic_inference.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
